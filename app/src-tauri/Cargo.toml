[package]
name = "opti-mqtt-tester"
version = "2.0.0"
description = "OptiPeople MQTT Tester"
authors = ["OptiPeople"]
edition = "2021"

[lib]
name = "opti_mqtt_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
tokio = { version = "1", features = ["time"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
form_urlencoded = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
